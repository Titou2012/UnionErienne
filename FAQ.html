<script>
/* =========================
   FAQ ACCORDION AMÉLIORÉ
========================= */
const questions = document.querySelectorAll('.faq-question');

questions.forEach((q, index) => {
    q.addEventListener('click', () => {
        const answer = q.nextElementSibling;

        // Fermer toutes les autres
        document.querySelectorAll('.faq-answer').forEach(a => {
            if (a !== answer) a.style.display = 'none';
        });

        // Toggle
        answer.style.display = answer.style.display === 'block' ? 'none' : 'block';

        saveFAQState();
    });
});

/* =========================
   SAUVEGARDE ÉTAT FAQ
========================= */
function saveFAQState() {
    const states = [];
    document.querySelectorAll('.faq-answer').forEach(a => {
        states.push(a.style.display === 'block');
    });
    localStorage.setItem('faqStates', JSON.stringify(states));
}

function loadFAQState() {
    const states = JSON.parse(localStorage.getItem('faqStates'));
    if (!states) return;

    document.querySelectorAll('.faq-answer').forEach((a, i) => {
        if (states[i]) a.style.display = 'block';
    });
}

/* =========================
   COMMENTAIRES AVEC STOCKAGE
========================= */
function addComment(btn) {
    const container = btn.parentElement;
    const input = btn.previousElementSibling;
    const text = input.value.trim();
    if (!text) return;

    const index = getFAQIndex(container);

    const commentData = {
        text: text,
        approved: false
    };

    let allComments = JSON.parse(localStorage.getItem('comments')) || {};
    if (!allComments[index]) allComments[index] = [];

    allComments[index].push(commentData);
    localStorage.setItem('comments', JSON.stringify(allComments));

    renderComments();
    input.value = '';
}

/* =========================
   AFFICHAGE COMMENTAIRES
========================= */
function renderComments() {
    const allComments = JSON.parse(localStorage.getItem('comments')) || {};

    document.querySelectorAll('.faq-item').forEach((item, index) => {
        const container = item.querySelector('.comments');
        container.innerHTML = '';

        if (!allComments[index]) return;

        allComments[index].forEach((c, i) => {
            const div = document.createElement('div');
            div.className = 'comment ' + (c.approved ? 'approved' : 'pending');

            div.innerHTML = `
                ${c.text}
                <span class="admin-btn" onclick="approveComment(${index}, ${i})">✔</span>
                <span class="admin-btn" style="color:red;" onclick="deleteComment(${index}, ${i})">✖</span>
            `;

            container.appendChild(div);
        });
    });
}

/* =========================
   APPROUVER COMMENTAIRE
========================= */
function approveComment(faqIndex, commentIndex) {
    let allComments = JSON.parse(localStorage.getItem('comments')) || {};

    allComments[faqIndex][commentIndex].approved = true;

    localStorage.setItem('comments', JSON.stringify(allComments));
    renderComments();
}

/* =========================
   SUPPRIMER COMMENTAIRE
========================= */
function deleteComment(faqIndex, commentIndex) {
    let allComments = JSON.parse(localStorage.getItem('comments')) || {};

    allComments[faqIndex].splice(commentIndex, 1);

    localStorage.setItem('comments', JSON.stringify(allComments));
    renderComments();
}

/* =========================
   UTILS
========================= */
function getFAQIndex(element) {
    return Array.from(document.querySelectorAll('.faq-item'))
        .indexOf(element.closest('.faq-item'));
}

/* =========================
   INIT
========================= */
loadFAQState();
renderComments();
</script>
